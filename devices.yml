########################################################################
# Basic anchors                                                        #
########################################################################

.devtools_packages:
  packages: &devtools_packages
    - droidian-devtools
    - adaptation-hybris-devtools

.adaptation_generic_packages:
  packages: &adaptation_generic_packages
    - adaptation-android-generic

.google_sargo_packages:
  packages: &google_sargo_packages
    - adaptation-google-sargo
    - adaptation-google-sargo-configs

.lenovo_bronco_packages:
  packages: &lenovo_bronco_packages
    - adaptation-lenovo-bronco
    - adaptation-lenovo-bronco-configs
    - ofono-ril-plugin

.volla_mimameid_packages:
  packages: &volla_mimameid_packages
    - adaptation-volla-mimameid-h12
    - adaptation-volla-mimameid-h12-configs

########################################################################
# Recovery-flashable rootfses                                          #
########################################################################

rootfs:
  type: rootfs
  arch: [arm64]
  edition: phosh
  variant: phone
  apilevel: [28, 29, 30, 32, 33]

  packages: *adaptation_generic_packages

  bundles:
    # Developer tools bundle
    - name: droidian-devtools
      arch: any
      apilevel: any
      only_stable: yes
      packages: *devtools_packages

########################################################################
# Device specific images                                               #
########################################################################

#
# Google
#

# Google Pixel 3a (sargo)
google_sargo:
  type: image
  arch: arm64
  edition: phosh
  variant: phone
  apilevel: 28

  packages: *google_sargo_packages

#
# Lenovo
#

# Lenovo Thinkphone by Motorola (bronco)
lenovo_bronco:
  type: image
  arch: arm64
  edition: [phosh, plamo_wf_experimental]
  variant: phone
  apilevel: 32

  packages: *lenovo_bronco_packages

#
# Volla
#

# Volla Phone 22 (mimameid)
volla_mimameid:
  type: image
  arch: arm64
  edition: phosh
  variant: phone
  apilevel: 32

  packages: *volla_mimameid_packages
